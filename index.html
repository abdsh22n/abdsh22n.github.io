<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عبدالودود شبعان - صفحة التواصل</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 50%, #f0f4f8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            direction: rtl;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 50px 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.08),
                0 8px 25px rgba(0, 0, 0, 0.04);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #667eea, #764ba2, #f093fb);
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            font-size: 48px;
            color: white;
            font-weight: 800;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .name {
            font-size: 28px;
            font-weight: 800;
            color: #2d3748;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 15px;
            color: #718096;
            margin-bottom: 35px;
            font-weight: 500;
        }

        .contact-info {
            background: #f7fafc;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: right;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .info-icon.phone {
            background: #e6fffa;
            color: #38b2ac;
        }

        .info-icon.email {
            background: #ebf8ff;
            color: #4299e1;
        }

        .info-text {
            font-size: 15px;
            color: #4a5568;
            font-weight: 500;
        }

        .social-links {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 24px;
            border-radius: 16px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 700;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .social-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .btn-whatsapp {
            background: linear-gradient(135deg, #25d366, #128c7e);
            color: white;
        }

        .btn-facebook {
            background: linear-gradient(135deg, #1877f2, #0d5cb6);
            color: white;
        }

        .qr-section {
            background: #f7fafc;
            border-radius: 20px;
            padding: 25px;
            margin-top: 10px;
        }

        .qr-title {
            font-size: 14px;
            color: #718096;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .qr-code {
            width: 180px;
            height: 180px;
            margin: 0 auto;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .qr-code img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #a0aec0;
        }

        @media (max-width: 480px) {
            .card {
                padding: 35px 25px;
            }
            .name {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">ع</div>
        <h1 class="name">عبدالودود شبعان</h1>
        <p class="subtitle">📱 تواصل معي عبر القنوات التالية</p>

        <div class="contact-info">
            <div class="info-item">
                <div class="info-icon phone">
                    <i class="fas fa-phone"></i>
                </div>
                <span class="info-text">0944846249</span>
            </div>
            <div class="info-item">
                <div class="info-icon email">
                    <i class="fas fa-envelope"></i>
                </div>
                <span class="info-text">abdsh22n@gmail.com</span>
            </div>
        </div>

        <div class="social-links">
            <a href="https://wa.me/963944846249" target="_blank" class="social-btn btn-whatsapp">
                <i class="fab fa-whatsapp"></i>
                واتساب
            </a>
            <a href="https://www.facebook.com/share/1BEbpCvkzU/" target="_blank" class="social-btn btn-facebook">
                <i class="fab fa-facebook-f"></i>
                فيسبوك
            </a>
        </div>

        <div class="qr-section">
            <p class="qr-title">📷 امسح الكود للوصول السريع</p>
            <div class="qr-code">
                <img src="qrcode.png" alt="QR Code">
            </div>
        </div>

        <p class="footer">صمم بـ ❤️ | عبدالودود شبعان</p>
    </div>
</body>
</html>
